# Local development override (Apple Silicon).
#
# postgis/postgis publishes only linux/amd64 manifests for both alpine and
# bookworm 17-3.5 tags. On Apple Silicon we run the amd64 image under Rosetta
# emulation. This is the standard escape hatch in Docker Desktop ≥4.16
# (Settings → General → "Use Rosetta for x86/amd64 emulation").
#
# This file is auto-loaded by `docker compose` alongside docker-compose.yml.
services:
  app:
    # Default 8080 is often occupied by other local APIs.
    # Keep the container on 8080, publish it on a free host port.
    ports: !override ["${BANI_DOCKER_APP_PORT:-28080}:8080"]
    environment:
      BANI_STORAGE_PUBLIC_BASE_URL: ${BANI_STORAGE_PUBLIC_BASE_URL:-http://localhost:9102}
  postgres:
    platform: linux/amd64
    image: postgis/postgis:17-3.5
    # Default 5432 collides with brew postgresql@16 (PID listening on 5432);
    # Postgres.app already grabs 5433 too, so we use 5435.
    ports: !override ["${BANI_DOCKER_POSTGRES_PORT:-5435}:5432"]
  redis:
    # Default 6379 collides with brew redis-server.
    ports: !override ["${BANI_DOCKER_REDIS_PORT:-6381}:6379"]
  minio:
    # 9000/9001 already taken on this host.
    ports: !override
      - "${BANI_DOCKER_MINIO_API_PORT:-9102}:9000"
      - "${BANI_DOCKER_MINIO_CONSOLE_PORT:-9103}:9001"
  frontend:
    # Vite default 5173; override if it collides locally.
    ports: !override ["${BANI_DOCKER_FRONTEND_PORT:-5173}:5173"]
