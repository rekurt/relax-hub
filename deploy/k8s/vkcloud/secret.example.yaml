apiVersion: v1
kind: Secret
metadata:
  name: relax-hub-secrets
  namespace: relax-hub
type: Opaque
stringData:
  POSTGRES_DB: relax_hub
  POSTGRES_USER: relax_hub
  POSTGRES_PASSWORD: replace-postgres-password
  REDIS_PASSWORD: replace-redis-password
  MINIO_ROOT_USER: relaxhub
  MINIO_ROOT_PASSWORD: replace-minio-root-password

  BANI_DATABASE_DSN: "postgres://relax_hub:replace-postgres-password@relax-hub-postgres:5432/relax_hub?sslmode=disable"
  BANI_REDIS_ADDR: "relax-hub-redis:6379"
  BANI_REDIS_PASSWORD: replace-redis-password
  BANI_JWT_SECRET: replace-with-64-plus-random-hex-characters
  BANI_STORAGE_ACCESS_KEY: relaxhub
  BANI_STORAGE_SECRET_KEY: replace-minio-root-password

  BANI_PAYMENT_YOOKASSA_SHOP_ID: ""
  BANI_PAYMENT_YOOKASSA_SECRET_KEY: ""
  BANI_PAYMENT_YOOKASSA_PAYOUT_AGENT_ID: ""
  BANI_PAYMENT_YOOKASSA_PAYOUT_SECRET_KEY: ""
  BANI_PAYMENT_BEPAID_SHOP_ID: ""
  BANI_PAYMENT_BEPAID_SECRET_KEY: ""

  BANI_OAUTH_VK_CLIENT_ID: ""
  BANI_OAUTH_VK_CLIENT_SECRET: ""
  BANI_OAUTH_YANDEX_CLIENT_ID: ""
  BANI_OAUTH_YANDEX_CLIENT_SECRET: ""
  BANI_OAUTH_GOOGLE_CLIENT_ID: ""
  BANI_OAUTH_GOOGLE_CLIENT_SECRET: ""

  BANI_TELEGRAM_BOT_TOKEN: ""
  # SMTP: reg.ru hosted mail. Password managed out-of-band; patched into the
  # live secret via kubectl patch. Port 587 = STARTTLS, 465 = implicit TLS.
  BANI_EMAIL_HOST: "mail.hosting.reg.ru"
  BANI_EMAIL_PORT: "587"
  BANI_EMAIL_USERNAME: "partners@relax-hub.ru"
  BANI_EMAIL_PASSWORD: ""
  BANI_EMAIL_FROM: "RelaxHUB <partners@relax-hub.ru>"
  BANI_SMS_API_KEY: ""
  BANI_WEBPUSH_VAPID_PUBLIC_KEY: ""
  BANI_WEBPUSH_VAPID_PRIVATE_KEY: ""
  BANI_WEBPUSH_VAPID_CONTACT: ""
  BANI_GEO_ISOCHRONE_API_KEY: ""
  BANI_GEO_YANDEX_SEARCH_API_KEY: ""
  BANI_FISCAL_ATOL_LOGIN: ""
  BANI_FISCAL_ATOL_PASSWORD: ""
  BANI_FISCAL_ATOL_GROUP_CODE: ""
