apiVersion: batch/v1
kind: Job
metadata:
  name: relax-hub-migrate
  labels:
    app.kubernetes.io/name: relax-hub
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relax-hub
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: relax-hub-api
          imagePullPolicy: IfNotPresent
          args:
            - migrate
            - up
          envFrom:
            - configMapRef:
                name: relax-hub-config
            - secretRef:
                name: relax-hub-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
