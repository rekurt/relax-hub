apiVersion: batch/v1
kind: Job
metadata:
  name: relax-hub-seed-demo
  labels:
    app.kubernetes.io/name: relax-hub
    app.kubernetes.io/component: seed-demo
spec:
  backoffLimit: 0              # seed-demo is non-idempotent in places (random visits),
                               # so we don't silently retry a half-applied state.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relax-hub
        app.kubernetes.io/component: seed-demo
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed-demo
          image: relax-hub-api
          imagePullPolicy: IfNotPresent
          args:
            - seed-demo
            - --password=DemoPass123!
          envFrom:
            - configMapRef:
                name: relax-hub-config
            - secretRef:
                name: relax-hub-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
