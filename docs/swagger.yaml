  /admin/analytics:
    get:
      description: Returns platform-wide analytics dashboard. Admin only.
      parameters:
      - default: 30d
        description: 'Period: 1d, 7d, 30d, 90d'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_nikitaaldaev_bani_internal_service.AdminDashboard'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Get admin analytics dashboard
      tags:
      - admin-analytics
  /admin/analytics/top:
    get:
      description: Returns top bathhouses ranked by a specified metric (views, bookings,
        revenue, rating). Admin only.
      parameters:
