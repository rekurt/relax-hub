basePath: /api/v1
definitions:
  handler.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  handler.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/handler.APIError'
      meta:
        $ref: '#/definitions/handler.Meta'
      success:
        type: boolean
    type: object
  handler.Meta:
    properties:
      page:
