host: localhost:8080
info:
  contact: {}
  description: API for the Bani bathhouse marketplace platform.
  title: Bani API
  version: "1.0"
paths:
  /admin/cities:
    post:
      consumes:
      - application/json
      description: Create a new city. Admin only.
      parameters:
      - description: City data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createCityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.cityResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Create city
      tags:
      - admin-cities
  /admin/cities/{id}:
    delete:
      description: Delete a city. Admin only.
      parameters:
      - description: City ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Delete city
      tags:
      - admin-cities
    put:
      consumes:
      - application/json
      description: Update an existing city. Admin only.
      parameters:
      - description: City ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateCityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.cityResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Update city
      tags:
      - admin-cities
  /admin/complaints:
    get:
      description: Returns a paginated list of complaints. Admin only. Supports filtering
        by status, target_type, reason, and date range.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by status (pending, resolved, dismissed)
        in: query
        name: status
        type: string
      - description: Filter by target type (review, bathhouse, user)
        in: query
        name: target_type
        type: string
      - description: Filter by reason (spam, offensive, fake, fraud, other)
        in: query
        name: reason
        type: string
      - description: Filter from date (RFC3339)
        in: query
        name: from_date
        type: string
      - description: Filter to date (RFC3339)
        in: query
        name: to_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.complaintResponse'
                  type: array
                meta:
                  $ref: '#/definitions/handler.Meta'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: List complaints
      tags:
      - admin-complaints
  /admin/complaints/{id}:
    get:
      description: Returns a single complaint by its ID. Admin only.
      parameters:
      - description: Complaint ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
