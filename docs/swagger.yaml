  handler.reorderPhotosRequest:
    properties:
      photo_ids:
        items:
          type: string
        type: array
    type: object
  handler.socialAccountResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      id:
        type: string
      linked_at:
        type: string
      name:
        type: string
      provider:
        type: string
    type: object
  handler.updateBathhouseRequest:
    properties:
      address:
        type: string
      city_id:
        type: integer
      description:
        type: string
      has_bbq:
        type: boolean
      has_hot_tub:
        type: boolean
      has_karaoke:
        type: boolean
      has_pool:
        type: boolean
      has_sauna:
        type: boolean
      has_steam_room:
        type: boolean
      images:
        items:
          type: string
        type: array
      latitude:
        type: number
      longitude:
        type: number
      max_guests:
        type: integer
      min_duration:
        type: integer
      name:
        type: string
      price_per_hour:
        type: integer
      working_hours:
        items:
          $ref: '#/definitions/handler.workingHoursRequest'
        type: array
    type: object
  handler.updateCityRequest:
    properties:
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      slug:
        type: string
    type: object
  handler.updateProfileRequest:
    properties:
      bio:
        type: string
      city_id:
        $ref: '#/definitions/handler.nullableInt64Field'
      name:
        type: string
      phone:
        type: string
    type: object
  handler.uploadPhotoRequest:
    properties:
      thumbnail_url:
        type: string
      url:
        type: string
    type: object
  handler.userResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      city_id:
        type: integer
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  handler.widgetCodeResponse:
    properties:
      api_key:
        type: string
      code:
        type: string
      script_url:
        type: string
      style_url:
        type: string
    type: object
  handler.widgetKeyResponse:
    properties:
      api_key:
        type: string
    type: object
  handler.workingHoursRequest:
    properties:
      close_time:
        type: string
      day_of_week:
        type: integer
      open_time:
        type: string
    type: object
  handler.workingHoursResp:
    properties:
      close_time:
        type: string
      day_of_week:
        type: integer
      open_time:
        type: string
    type: object
  seo.MetaTags:
    properties:
      canonical:
        type: string
      description:
        type: string
      og_image:
        type: string
      og_type:
        type: string
      title:
        type: string
    type: object
  service.MyStatsOutput:
    properties:
      avg_check:
        type: integer
      avg_rating:
        type: number
      review_count:
        type: integer
      total_spent:
        type: integer
      total_visits:
        type: integer
    type: object
  service.TimeSlot:
    properties:
      available:
        type: boolean
      endTime:
        type: string
      price:
        description: Price in kopecks for this hour slot
        format: int64
        type: integer
      startTime:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for the Bani bathhouse marketplace platform.
  title: Bani API
  version: "1.0"
paths:
  /admin/cities:
    post:
      consumes:
      - application/json
      description: Create a new city. Admin only.
      parameters:
      - description: City data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createCityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.cityResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Create city
      tags:
      - admin-cities
  /admin/cities/{id}:
    delete:
      description: Delete a city. Admin only.
      parameters:
      - description: City ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Delete city
      tags:
      - admin-cities
    put:
      consumes:
      - application/json
      description: Update an existing city. Admin only.
      parameters:
      - description: City ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateCityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.cityResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Update city
      tags:
      - admin-cities
  /admin/photos/{id}/reject:
    patch:
      consumes:
      - application/json
      description: Reject a pending photo with a reason. Admin only.
      parameters:
      - description: Photo ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Rejection reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.rejectPhotoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.photoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Reject photo
      tags:
      - admin-photos
  /admin/photos/{id}/verify:
    patch:
      description: Approve a pending photo. Admin only.
      parameters:
      - description: Photo ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.photoResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Verify photo
      tags:
      - admin-photos
  /admin/photos/pending:
    get:
      description: List photos awaiting verification. Admin only.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.photoResponse'
                  type: array
                meta:
                  $ref: '#/definitions/handler.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: List pending photos
      tags:
      - admin-photos
  /auth/link/{provider}:
    delete:
      description: Unlinks a social account from the authenticated user
      parameters:
      - description: OAuth provider (vk, yandex, google)
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  properties:
                    status:
                      type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Unlink social account
      tags:
      - oauth
    post:
      consumes:
      - application/json
      description: Links a social account to the authenticated user
      parameters:
      - description: OAuth provider (vk, yandex, google)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code
        in: body
        name: body
        required: true
        schema:
          properties:
            code:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  properties:
                    status:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Link social account
      tags:
      - oauth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.authResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      summary: Login
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.userResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's profile fields
      parameters:
      - description: Profile fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.userResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - auth
  /auth/me/avatar:
    delete:
      description: Removes the authenticated user's avatar
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.userResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Delete avatar
      tags:
      - auth
    post:
      consumes:
      - multipart/form-data
      description: Uploads a new avatar image for the authenticated user (JPEG or
        PNG, max 5MB)
      parameters:
      - description: Avatar image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
