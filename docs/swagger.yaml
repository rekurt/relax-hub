    type: object
  handler.bathhouseResponse:
    properties:
      address:
        type: string
      city_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      gallery_preview:
        items:
          $ref: '#/definitions/handler.mediaResponse'
