          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Get widget embed code
      tags:
      - widgets
