      has_bbq:
        type: boolean
      has_hot_tub:
        type: boolean
      has_karaoke:
        type: boolean
      has_pool:
        type: boolean
      has_sauna:
        type: boolean
      has_steam_room:
        type: boolean
      id:
        type: string
      images:
        items:
          type: string
        type: array
      is_favorite:
        type: boolean
      is_photo_verified:
        type: boolean
      is_promoted:
        type: boolean
      latitude:
        type: number
      longitude:
        type: number
      max_guests:
        type: integer
      meta:
        $ref: '#/definitions/seo.MetaTags'
      min_duration:
        type: integer
      name:
        type: string
      owner_id:
        type: string
      price_per_hour:
        type: integer
      rating:
        type: number
      review_count:
        type: integer
      slug:
        type: string
      status:
        type: string
      updated_at:
        type: string
      working_hours:
        items:
          $ref: '#/definitions/handler.workingHoursResp'
        type: array
    type: object
  handler.cityResponse:
    properties:
      id:
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      slug:
        type: string
    type: object
  handler.createBathhouseRequest:
    properties:
      address:
        type: string
      city_id:
        type: integer
      description:
        type: string
      has_bbq:
        type: boolean
      has_hot_tub:
        type: boolean
      has_karaoke:
        type: boolean
      has_pool:
        type: boolean
      has_sauna:
        type: boolean
      has_steam_room:
        type: boolean
      images:
        items:
          type: string
        type: array
      latitude:
        type: number
      longitude:
        type: number
      max_guests:
        type: integer
      min_duration:
        type: integer
      name:
        type: string
      price_per_hour:
        type: integer
      working_hours:
        items:
          $ref: '#/definitions/handler.workingHoursRequest'
        type: array
    type: object
  handler.createCityRequest:
    properties:
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      slug:
        type: string
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.mediaResponse:
    properties:
      created_at:
        type: string
      height:
        type: integer
      id:
        type: string
      mime_type:
        type: string
      original_name:
        type: string
      size:
        type: integer
      status:
        type: string
      thumbnail_url:
        type: string
      type:
        type: string
      url:
        type: string
      width:
        type: integer
    type: object
  handler.nullableInt64Field:
    properties:
      set:
        type: boolean
      value:
