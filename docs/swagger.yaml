            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Get complaint by ID
      tags:
      - admin-complaints
