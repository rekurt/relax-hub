basePath: /api/v1
definitions:
  github_com_nikitaaldaev_bani_internal_service.MyStatsOutput:
    properties:
      avg_check:
        type: integer
      avg_rating:
        type: number
      review_count:
        type: integer
      total_spent:
        type: integer
      total_visits:
        type: integer
    type: object
  internal_handler.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  internal_handler.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/internal_handler.APIError'
      meta:
        $ref: '#/definitions/internal_handler.Meta'
      success:
        type: boolean
    type: object
  internal_handler.Meta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_handler.authResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/internal_handler.userResponse'
    type: object
  internal_handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_handler.nullableInt64Field:
    properties:
      set:
        type: boolean
      value:
        format: int64
        type: integer
    type: object
  internal_handler.oauthCallbackResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/internal_handler.userResponse'
    type: object
  internal_handler.publicProfileResponse:
    properties:
      avatar_url:
        type: string
      avg_rating:
        type: number
      bio:
        type: string
      city_name:
        type: string
      id:
        type: string
      member_since:
        type: string
      name:
        type: string
      review_count:
        type: integer
      visit_count:
        type: integer
    type: object
  internal_handler.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      referral_code:
        type: string
      role:
        type: string
    type: object
  internal_handler.socialAccountResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      id:
        type: string
      linked_at:
        type: string
      name:
        type: string
      provider:
        type: string
    type: object
  internal_handler.updateProfileRequest:
    properties:
      bio:
        type: string
      city_id:
        $ref: '#/definitions/internal_handler.nullableInt64Field'
      name:
        type: string
      phone:
        type: string
    type: object
  internal_handler.userResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      city_id:
        type: integer
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for the Bani bathhouse marketplace platform.
  title: Bani API
  version: "1.0"
paths:
  /auth/link/{provider}:
    delete:
      description: Unlinks a social account from the authenticated user
      parameters:
      - description: OAuth provider (vk, yandex, google)
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  properties:
                    status:
                      type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Unlink social account
      tags:
      - oauth
    post:
      consumes:
      - application/json
      description: Links a social account to the authenticated user
      parameters:
      - description: OAuth provider (vk, yandex, google)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code
        in: body
        name: body
        required: true
        schema:
          properties:
            code:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  properties:
                    status:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Link social account
      tags:
      - oauth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.authResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      summary: Login
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.userResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's profile fields
      parameters:
      - description: Profile fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.userResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - auth
  /auth/me/avatar:
    delete:
      description: Removes the authenticated user's avatar
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.userResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Delete avatar
      tags:
      - auth
    post:
      consumes:
      - multipart/form-data
      description: Uploads a new avatar image for the authenticated user (JPEG or
        PNG, max 5MB)
      parameters:
      - description: Avatar image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.userResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Upload avatar
      tags:
      - auth
  /auth/me/social-accounts:
    get:
      description: Returns the list of social accounts linked to the authenticated
        user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_handler.socialAccountResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: List linked social accounts
      tags:
      - oauth
  /auth/oauth/{provider}:
    get:
      description: Redirects the user to the OAuth provider's authorization page
      parameters:
      - description: OAuth provider (vk, yandex, google)
        in: path
        name: provider
        required: true
        type: string
      - description: Referral code
        in: query
        name: referral_code
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      summary: OAuth redirect
      tags:
      - oauth
  /auth/oauth/{provider}/callback:
    get:
      description: Handles the OAuth provider callback, authenticates or registers
        the user
      parameters:
      - description: OAuth provider (vk, yandex, google)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: State parameter
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.oauthCallbackResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      summary: OAuth callback
      tags:
      - oauth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with the given credentials and role
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.authResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      summary: Register a new user
      tags:
      - auth
  /my/stats:
    get:
      description: Returns booking and review statistics for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_nikitaaldaev_bani_internal_service.MyStatsOutput'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Get my statistics
      tags:
      - users
  /users/{id}/profile:
    get:
      description: Returns a user's public profile by ID
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_handler.publicProfileResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/internal_handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_handler.APIError'
              type: object
      summary: Get public user profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer token. Format: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
