      description: Generate HTML embed code for the booking widget with customization
        options.
      parameters:
      - description: Bathhouse ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - default: '#4CAF50'
        description: Widget accent color (#RRGGBB)
        in: query
        name: color
        type: string
      - description: Font family for the widget
        in: query
        name: font_family
        type: string
      - description: Show price in widget
        in: query
        name: show_price
        type: boolean
      - description: Show rating in widget
        in: query
        name: show_rating
        type: boolean
      - default: en
        description: Widget language
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.widgetCodeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/handler.APIError'
              type: object
        "403":
