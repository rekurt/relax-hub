      status:
        type: string
      thumbnail_url:
        type: string
      uploaded_at:
        type: string
      url:
        type: string
      verified_at:
        type: string
      verified_by_id:
        type: string
    type: object
  handler.publicProfileResponse:
    properties:
      avatar_url:
        type: string
      avg_rating:
        type: number
      bio:
        type: string
      city_name:
        type: string
      id:
        type: string
      member_since:
        type: string
      name:
        type: string
      review_count:
        type: integer
      visit_count:
        type: integer
    type: object
  handler.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      referral_code:
        type: string
      role:
        type: string
