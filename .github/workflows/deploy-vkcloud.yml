name: Deploy VK Cloud Kubernetes

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vkcloud-production
  cancel-in-progress: false

env:
  KUBE_NAMESPACE: relax-hub
  DEPLOY_PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
  REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER || 'ghcr.io' }}
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || vars.REGISTRY_USERNAME || github.actor }}
  API_IMAGE: ${{ vars.API_IMAGE || format('ghcr.io/{0}/relax-hub-api', github.repository_owner) }}
  FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE || format('ghcr.io/{0}/relax-hub-frontend', github.repository_owner) }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB || 'relax_hub' }}
  POSTGRES_USER: ${{ vars.POSTGRES_USER || 'relax_hub' }}
  MINIO_ROOT_USER: ${{ vars.MINIO_ROOT_USER || 'relaxhub' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          BANI_JWT_SECRET: ${{ secrets.BANI_JWT_SECRET }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            KUBE_CONFIG_B64 \
            REGISTRY_USERNAME \
            REGISTRY_PASSWORD \
            POSTGRES_PASSWORD \
            REDIS_PASSWORD \
            MINIO_ROOT_PASSWORD \
            BANI_JWT_SECRET
          do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret or variable ${name} is required"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_SERVER }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.DEPLOY_PLATFORM }}
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ env.DEPLOY_PLATFORM }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Refresh Keystone token and build kubeconfig
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          K8S_API_SERVER: ${{ secrets.K8S_API_SERVER }}
          K8S_CA_B64: ${{ secrets.K8S_CA_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/kube"

          # Build auth request body via jq to escape OS_PASSWORD safely (it can contain ! : { } etc.)
          body=$(jq -n \
            --arg user "$OS_USERNAME" \
            --arg domain "$OS_USER_DOMAIN_NAME" \
            --arg password "$OS_PASSWORD" \
            --arg project "$OS_PROJECT_ID" \
            '{auth:{identity:{methods:["password"],password:{user:{name:$user,domain:{name:$domain},password:$password}}},scope:{project:{id:$project}}}}')

          # Keystone returns the token in the X-Subject-Token response header
          resp=$(curl -sSi -X POST -H "Content-Type: application/json" -d "$body" "${OS_AUTH_URL}auth/tokens")
          token=$(echo "$resp" | awk 'BEGIN{IGNORECASE=1} /^x-subject-token:/ {print $2}' | tr -d '\r\n')
          if [ -z "$token" ]; then
            echo "::error::Failed to obtain Keystone project-scoped token"
            echo "$resp" | head -30
            exit 1
          fi

          cat > "$RUNNER_TEMP/kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: cluster
            cluster:
              server: ${K8S_API_SERVER}
              certificate-authority-data: ${K8S_CA_B64}
          contexts:
          - name: default
            context:
              cluster: cluster
              user: cluster
          current-context: default
          users:
          - name: cluster
            user:
              token: ${token}
          EOF
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
          echo "::notice::Fresh Keystone token issued for $OS_USERNAME, kubeconfig written"

      - name: Prepare Kubernetes secrets
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          BANI_JWT_SECRET: ${{ secrets.BANI_JWT_SECRET }}
          BANI_PAYMENT_YOOKASSA_SHOP_ID: ${{ secrets.BANI_PAYMENT_YOOKASSA_SHOP_ID }}
          BANI_PAYMENT_YOOKASSA_SECRET_KEY: ${{ secrets.BANI_PAYMENT_YOOKASSA_SECRET_KEY }}
          BANI_PAYMENT_YOOKASSA_PAYOUT_AGENT_ID: ${{ secrets.BANI_PAYMENT_YOOKASSA_PAYOUT_AGENT_ID }}
          BANI_PAYMENT_YOOKASSA_PAYOUT_SECRET_KEY: ${{ secrets.BANI_PAYMENT_YOOKASSA_PAYOUT_SECRET_KEY }}
          BANI_PAYMENT_BEPAID_SHOP_ID: ${{ secrets.BANI_PAYMENT_BEPAID_SHOP_ID }}
          BANI_PAYMENT_BEPAID_SECRET_KEY: ${{ secrets.BANI_PAYMENT_BEPAID_SECRET_KEY }}
          BANI_OAUTH_VK_CLIENT_ID: ${{ secrets.BANI_OAUTH_VK_CLIENT_ID }}
          BANI_OAUTH_VK_CLIENT_SECRET: ${{ secrets.BANI_OAUTH_VK_CLIENT_SECRET }}
          BANI_OAUTH_YANDEX_CLIENT_ID: ${{ secrets.BANI_OAUTH_YANDEX_CLIENT_ID }}
          BANI_OAUTH_YANDEX_CLIENT_SECRET: ${{ secrets.BANI_OAUTH_YANDEX_CLIENT_SECRET }}
          BANI_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.BANI_OAUTH_GOOGLE_CLIENT_ID }}
          BANI_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.BANI_OAUTH_GOOGLE_CLIENT_SECRET }}
          BANI_TELEGRAM_BOT_TOKEN: ${{ secrets.BANI_TELEGRAM_BOT_TOKEN }}
          BANI_EMAIL_HOST: ${{ secrets.BANI_EMAIL_HOST }}
          BANI_EMAIL_USERNAME: ${{ secrets.BANI_EMAIL_USERNAME }}
          BANI_EMAIL_PASSWORD: ${{ secrets.BANI_EMAIL_PASSWORD }}
          BANI_EMAIL_FROM: ${{ secrets.BANI_EMAIL_FROM }}
          BANI_SMS_API_KEY: ${{ secrets.BANI_SMS_API_KEY }}
          BANI_WEBPUSH_VAPID_PUBLIC_KEY: ${{ secrets.BANI_WEBPUSH_VAPID_PUBLIC_KEY }}
          BANI_WEBPUSH_VAPID_PRIVATE_KEY: ${{ secrets.BANI_WEBPUSH_VAPID_PRIVATE_KEY }}
          BANI_WEBPUSH_VAPID_CONTACT: ${{ secrets.BANI_WEBPUSH_VAPID_CONTACT }}
          BANI_GEO_ISOCHRONE_API_KEY: ${{ secrets.BANI_GEO_ISOCHRONE_API_KEY }}
          BANI_GEO_YANDEX_SEARCH_API_KEY: ${{ secrets.BANI_GEO_YANDEX_SEARCH_API_KEY }}
          BANI_FISCAL_ATOL_LOGIN: ${{ secrets.BANI_FISCAL_ATOL_LOGIN }}
          BANI_FISCAL_ATOL_PASSWORD: ${{ secrets.BANI_FISCAL_ATOL_PASSWORD }}
          BANI_FISCAL_ATOL_GROUP_CODE: ${{ secrets.BANI_FISCAL_ATOL_GROUP_CODE }}
        run: |
          set -euo pipefail

          kubectl apply -f deploy/k8s/vkcloud/namespace.yaml

          kubectl -n "$KUBE_NAMESPACE" create secret docker-registry registry-credentials \
            --docker-server="$REGISTRY_SERVER" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          DB_PASSWORD_ENC="$(python3 - <<'PY'
          import os
          import urllib.parse

          print(urllib.parse.quote(os.environ["POSTGRES_PASSWORD"], safe=""))
          PY
          )"
          DATABASE_DSN="postgres://${POSTGRES_USER}:${DB_PASSWORD_ENC}@relax-hub-postgres:5432/${POSTGRES_DB}?sslmode=disable"

          kubectl -n "$KUBE_NAMESPACE" create secret generic relax-hub-secrets \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --from-literal=BANI_DATABASE_DSN="$DATABASE_DSN" \
            --from-literal=BANI_REDIS_ADDR="relax-hub-redis:6379" \
            --from-literal=BANI_REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=BANI_JWT_SECRET="$BANI_JWT_SECRET" \
            --from-literal=BANI_STORAGE_ACCESS_KEY="$MINIO_ROOT_USER" \
            --from-literal=BANI_STORAGE_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
            --from-literal=BANI_PAYMENT_YOOKASSA_SHOP_ID="$BANI_PAYMENT_YOOKASSA_SHOP_ID" \
            --from-literal=BANI_PAYMENT_YOOKASSA_SECRET_KEY="$BANI_PAYMENT_YOOKASSA_SECRET_KEY" \
            --from-literal=BANI_PAYMENT_YOOKASSA_PAYOUT_AGENT_ID="$BANI_PAYMENT_YOOKASSA_PAYOUT_AGENT_ID" \
            --from-literal=BANI_PAYMENT_YOOKASSA_PAYOUT_SECRET_KEY="$BANI_PAYMENT_YOOKASSA_PAYOUT_SECRET_KEY" \
            --from-literal=BANI_PAYMENT_BEPAID_SHOP_ID="$BANI_PAYMENT_BEPAID_SHOP_ID" \
            --from-literal=BANI_PAYMENT_BEPAID_SECRET_KEY="$BANI_PAYMENT_BEPAID_SECRET_KEY" \
            --from-literal=BANI_OAUTH_VK_CLIENT_ID="$BANI_OAUTH_VK_CLIENT_ID" \
            --from-literal=BANI_OAUTH_VK_CLIENT_SECRET="$BANI_OAUTH_VK_CLIENT_SECRET" \
            --from-literal=BANI_OAUTH_YANDEX_CLIENT_ID="$BANI_OAUTH_YANDEX_CLIENT_ID" \
            --from-literal=BANI_OAUTH_YANDEX_CLIENT_SECRET="$BANI_OAUTH_YANDEX_CLIENT_SECRET" \
            --from-literal=BANI_OAUTH_GOOGLE_CLIENT_ID="$BANI_OAUTH_GOOGLE_CLIENT_ID" \
            --from-literal=BANI_OAUTH_GOOGLE_CLIENT_SECRET="$BANI_OAUTH_GOOGLE_CLIENT_SECRET" \
            --from-literal=BANI_TELEGRAM_BOT_TOKEN="$BANI_TELEGRAM_BOT_TOKEN" \
            --from-literal=BANI_EMAIL_HOST="$BANI_EMAIL_HOST" \
            --from-literal=BANI_EMAIL_USERNAME="$BANI_EMAIL_USERNAME" \
            --from-literal=BANI_EMAIL_PASSWORD="$BANI_EMAIL_PASSWORD" \
            --from-literal=BANI_EMAIL_FROM="$BANI_EMAIL_FROM" \
            --from-literal=BANI_SMS_API_KEY="$BANI_SMS_API_KEY" \
            --from-literal=BANI_WEBPUSH_VAPID_PUBLIC_KEY="$BANI_WEBPUSH_VAPID_PUBLIC_KEY" \
            --from-literal=BANI_WEBPUSH_VAPID_PRIVATE_KEY="$BANI_WEBPUSH_VAPID_PRIVATE_KEY" \
            --from-literal=BANI_WEBPUSH_VAPID_CONTACT="$BANI_WEBPUSH_VAPID_CONTACT" \
            --from-literal=BANI_GEO_ISOCHRONE_API_KEY="$BANI_GEO_ISOCHRONE_API_KEY" \
            --from-literal=BANI_GEO_YANDEX_SEARCH_API_KEY="$BANI_GEO_YANDEX_SEARCH_API_KEY" \
            --from-literal=BANI_FISCAL_ATOL_LOGIN="$BANI_FISCAL_ATOL_LOGIN" \
            --from-literal=BANI_FISCAL_ATOL_PASSWORD="$BANI_FISCAL_ATOL_PASSWORD" \
            --from-literal=BANI_FISCAL_ATOL_GROUP_CODE="$BANI_FISCAL_ATOL_GROUP_CODE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Prepare rendered manifests
        run: |
          set -euo pipefail

          cp -R deploy/k8s/vkcloud "$RUNNER_TEMP/vkcloud"

          (
            cd "$RUNNER_TEMP/vkcloud"
            kustomize edit set image relax-hub-api="${API_IMAGE}:${GITHUB_SHA}"
            kustomize edit set image relax-hub-frontend="${FRONTEND_IMAGE}:${GITHUB_SHA}"
            kustomize build . > "$RUNNER_TEMP/app.yaml"
          )

          (
            cd "$RUNNER_TEMP/vkcloud/migrate"
            kustomize edit set image relax-hub-api="${API_IMAGE}:${GITHUB_SHA}"
            kustomize build . > "$RUNNER_TEMP/migrate.yaml"
          )

      - name: Deploy stateful dependencies
        run: |
          set -euo pipefail

          kubectl -n "$KUBE_NAMESPACE" apply -f deploy/k8s/vkcloud/configmap.yaml
          kubectl -n "$KUBE_NAMESPACE" apply -f deploy/k8s/vkcloud/postgres.yaml
          kubectl -n "$KUBE_NAMESPACE" apply -f deploy/k8s/vkcloud/redis.yaml
          kubectl -n "$KUBE_NAMESPACE" apply -f deploy/k8s/vkcloud/minio.yaml

          kubectl -n "$KUBE_NAMESPACE" rollout status statefulset/relax-hub-postgres --timeout=300s
          kubectl -n "$KUBE_NAMESPACE" rollout status statefulset/relax-hub-redis --timeout=300s
          kubectl -n "$KUBE_NAMESPACE" rollout status statefulset/relax-hub-minio --timeout=300s

      - name: Run database migrations
        run: |
          set -euo pipefail

          kubectl -n "$KUBE_NAMESPACE" delete job relax-hub-migrate --ignore-not-found
          kubectl apply -f "$RUNNER_TEMP/migrate.yaml"

          if ! kubectl -n "$KUBE_NAMESPACE" wait --for=condition=complete job/relax-hub-migrate --timeout=300s; then
            kubectl -n "$KUBE_NAMESPACE" logs job/relax-hub-migrate --all-containers=true
            exit 1
          fi

      - name: Deploy application
        run: |
          set -euo pipefail

          kubectl apply -f "$RUNNER_TEMP/app.yaml"
          kubectl -n "$KUBE_NAMESPACE" rollout status deploy/relax-hub-api --timeout=300s
          kubectl -n "$KUBE_NAMESPACE" rollout status deploy/relax-hub-frontend --timeout=300s

      - name: Show deployed resources
        run: |
          set -euo pipefail

          kubectl -n "$KUBE_NAMESPACE" get pods,svc,statefulset,pvc,ingress
