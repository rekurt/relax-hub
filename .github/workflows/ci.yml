name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sentinel
        run: echo "backend job started on $(uname -a) at $(date -Iseconds)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Regenerate swagger & detect drift
        run: |
          set -euo pipefail
          make swagger
          if ! git diff --exit-code -- docs/; then
            echo "::error::swagger spec drift detected. Run 'make swagger' locally and commit the result."
            git --no-pager diff -- docs/ | head -200
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Vet
        run: make vet

      - name: Security scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity medium -confidence medium -quiet ./...

      - name: Test with coverage
        run: go test $(go list ./... | grep -v '/frontend/node_modules/') -race -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${total}%"
          # Target: 80%. Current baseline ~50% due to postgres repos requiring real DB.
          threshold=45
          if ! awk -v total="${total}" -v threshold="${threshold}" 'BEGIN { exit !(total + 0 >= threshold + 0) }'; then
            echo "Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

      - name: Build
        run: go build $(go list ./... | grep -v '/frontend/node_modules/')

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Sentinel
        run: echo "frontend job started on $(uname -a) at $(date -Iseconds)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client and detect drift
        run: |
          set -euo pipefail
          make frontend-generate-api
          if ! git diff --exit-code -- frontend/src/api/generated; then
            echo "::error::frontend API client drift detected. Run 'make frontend-generate-api' locally and commit the result."
            git --no-pager diff -- frontend/src/api/generated | head -200
            exit 1
          fi

      - name: Build
        run: make frontend-build

      - name: Test
        run: make frontend-test
